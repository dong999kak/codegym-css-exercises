<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <main class="login-card text-center">
    <div class="brand-mark" aria-hidden="true">B</div>
    <h1 class="h3 mb-3 fw-normal">Đăng nhập</h1>
    <p class="text-secondary mb-4">Chào mừng bạn quay lại</p>
    <form>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required autofocus>
        <label for="email">Địa chỉ email</label>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="password" placeholder="Mật khẩu" required>
        <label for="password">Mật khẩu</label>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check text-start">
          <input class="form-check-input" type="checkbox" value="remember-me" id="remember">
          <label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label>
        </div>
        <a href="#">Quên mật khẩu?</a>
      </div>
      <button class="w-100 btn btn-lg btn-primary" type="submit">Đăng nhập</button>
    </form>
    <p class="mt-4 mb-0 text-secondary">Chưa có tài khoản? <a href="#">Đăng ký</a></p>
    <p class="mt-5 mb-0 text-secondary small">© 2026 CodeGym</p>
  </main>
</body>
</html>
