<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng CSS vào trang HTML</title>
    <link rel="stylesheet" href="activity-416.css">
    <style>
        .internal-text { color: seagreen; }
    </style>
</head>
<body>
    <h1 style="color: royalblue;">Ví dụ nhúng CSS</h1>
    <p class="internal-text">Đoạn này được định dạng bằng internal CSS.</p>
    <p class="external-text">Đoạn này được định dạng bằng external CSS.</p>
</body>
</html>
