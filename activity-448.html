<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery ảnh | CodeGym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container py-5">
    <header class="text-center mb-5">
      <p class="eyebrow">BỘ SƯU TẬP</p>
      <h1 class="display-5 fw-bold">Khám phá thế giới</h1>
      <p class="text-secondary">Một vài khoảnh khắc đẹp được sắp xếp bằng Bootstrap Grid.</p>
    </header>
    <section class="row g-4" aria-label="Thư viện ảnh">
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1015/640/480" alt="Thác nước giữa rừng"><figcaption>Thiên nhiên xanh</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1011/640/480" alt="Người leo núi nhìn ra thung lũng"><figcaption>Chuyến phiêu lưu</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1016/640/480" alt="Rừng thông nhìn từ trên cao"><figcaption>Khoảnh khắc bình yên</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1020/640/480" alt="Chú chó trong chuyến đi"><figcaption>Người bạn đồng hành</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1039/640/480" alt="Con đường xuyên qua cánh đồng"><figcaption>Đường về nhà</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1043/640/480" alt="Hồ nước xanh dưới chân núi"><figcaption>Sắc xanh mùa hạ</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1050/640/480" alt="Đàn chim trên nền trời"><figcaption>Bay cao</figcaption></figure></div>
      <div class="col-12 col-sm-6 col-lg-3"><figure class="gallery-card"><img src="https://picsum.photos/id/1060/640/480" alt="Bờ biển lúc hoàng hôn"><figcaption>Hoàng hôn cuối tuần</figcaption></figure></div>
    </section>
  </main>
</body>
</html>
